services:
  postgres:
    image: postgres:16-alpine
    container_name: distributed-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: distributed_ai
      POSTGRES_USER: distributed_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - distributed-ai-postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distributed_ai -d distributed_ai"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  distributed-ai-postgres-data:
